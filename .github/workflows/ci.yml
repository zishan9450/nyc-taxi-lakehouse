name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests dags
      - name: Unit tests (plain Spark)
        run: pytest
      - name: "Pipeline tests on tiny files (Delta: idempotency, schema evolution, MERGE, gates)"
        run: pytest -m delta
