# Golden questions. Answerable ones carry reference SQL (any of accept_sql may match);
# refusal ones pass when nothing is executed. Add more to reach 40-50 before quoting results.
- id: s01
  category: simple_agg
  question: How many trips were there in total?
  accept_sql:
  - SELECT SUM(trips) FROM trips_by_zone_day
- id: s02
  category: simple_agg
  question: What was the total revenue in March 2024?
  accept_sql:
  - SELECT SUM(revenue) FROM trips_by_zone_day WHERE pickup_month = '2024-03'
- id: s03
  category: simple_agg
  question: What is the average trip distance across all trips?
  accept_sql:
  - SELECT SUM(avg_distance_miles * trips) / SUM(trips) FROM trips_by_zone_day
- id: s04
  category: simple_agg
  question: How many trips happened on February 14, 2024?
  accept_sql:
  - SELECT SUM(trips) FROM trips_by_zone_day WHERE pickup_date = DATE '2024-02-14'
- id: s05
  category: simple_agg
  question: What was the total revenue for each month?
  accept_sql:
  - SELECT pickup_month, SUM(revenue) FROM trips_by_zone_day GROUP BY pickup_month
- id: s06
  category: simple_agg
  question: Which hour of the day has the highest total revenue?
  accept_sql:
  - SELECT pickup_hour FROM revenue_by_hour GROUP BY pickup_hour ORDER BY SUM(revenue) DESC LIMIT 1
- id: j01
  category: join
  question: Which borough had the most trips?
  accept_sql:
  - SELECT z.borough FROM trips_by_zone_day t JOIN dim_zone z ON t.pu_location_id = z.location_id GROUP BY z.borough ORDER BY SUM(t.trips) DESC LIMIT 1
- id: j02
  category: join
  question: What are the top 5 pickup zones by number of trips?
  accept_sql:
  - SELECT z.zone, SUM(t.trips) FROM trips_by_zone_day t JOIN dim_zone z ON t.pu_location_id = z.location_id GROUP BY z.zone ORDER BY SUM(t.trips) DESC LIMIT 5
- id: j03
  category: join
  question: How many trips were there in each borough?
  accept_sql:
  - SELECT z.borough, SUM(t.trips) FROM trips_by_zone_day t JOIN dim_zone z ON t.pu_location_id = z.location_id GROUP BY z.borough
- id: j04
  category: join
  question: What was the average trip duration in minutes for pickups at JFK Airport?
  accept_sql:
  - SELECT SUM(t.avg_duration_min * t.trips) / SUM(t.trips) FROM trips_by_zone_day t JOIN dim_zone z ON t.pu_location_id = z.location_id WHERE z.zone = 'JFK Airport'
- id: j05
  category: join
  question: How much revenue came from Manhattan pickups in January 2024?
  accept_sql:
  - SELECT SUM(t.revenue) FROM trips_by_zone_day t JOIN dim_zone z ON t.pu_location_id = z.location_id WHERE z.borough = 'Manhattan' AND t.pickup_month = '2024-01'
- id: j06
  category: join
  question: How many trips started in each service zone?
  accept_sql:
  - SELECT z.service_zone, SUM(t.trips) FROM trips_by_zone_day t JOIN dim_zone z ON t.pu_location_id = z.location_id GROUP BY z.service_zone
- id: j07
  category: join
  question: Which zone in Brooklyn had the most trips in June 2024?
  accept_sql:
  - SELECT z.zone FROM trips_by_zone_day t JOIN dim_zone z ON t.pu_location_id = z.location_id WHERE z.borough = 'Brooklyn' AND t.pickup_month = '2024-06' GROUP BY z.zone ORDER BY SUM(t.trips) DESC LIMIT
    1
