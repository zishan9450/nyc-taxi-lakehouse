name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Tests (model is scripted; no API key, no network)
        run: pytest
      - name: Eval harness self-check (oracle model)
        run: |
          python -m ask_lakehouse demo-data
          python -m ask_lakehouse eval --label oracle-check --llm oracle --out /tmp/eval-results
