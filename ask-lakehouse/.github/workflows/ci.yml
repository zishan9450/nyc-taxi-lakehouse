name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Tests (model is scripted; no API key, no network)
        run: pytest
      - name: Eval harness self-check (oracle model)
        run: |
          python -m ask_lakehouse demo-data
          python -m ask_lakehouse eval --label oracle-check --llm oracle --out /tmp/eval-results
