[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-lakehouse"
version = "0.1.0"
description = "Natural-language analytics assistant over lakehouse gold tables: validated SQL, guardrails, and an eval harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "sqlglot>=25",
    "pyyaml>=6",
    "pyarrow>=15",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
export = ["deltalake>=0.18"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "deltalake>=0.18", "matplotlib>=3.8"]

[project.scripts]
ask-lakehouse = "ask_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ask_lakehouse = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
